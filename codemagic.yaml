workflows:
  ios-signed-build:
    name: ClearPocket Signed Build
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.grost9999.clearpocket

    scripts:
      - name: Install XcodeGen
        script: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode project
        script: |
          set -e
          cd "$CM_BUILD_DIR/ClearPocket"
          xcodegen generate

      - name: Configure signing
        script: |
          set -e
          cd "$CM_BUILD_DIR/ClearPocket"
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR/ClearPocket"
          xcode-project build-ipa \
            --project ClearPocket.xcodeproj \
            --scheme ClearPocket

    artifacts:
      - ClearPocket/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
