workflows:
  ios-build-check:
    name: ClearPocket TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 30

    integrations:
      app_store_connect: Codemagic-ClearPocket

    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.grost9999.clearpocket

    scripts:
      - name: Install XcodeGen
        script: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Create app icon
        script: |
          set -e
          cd "$CM_BUILD_DIR/ClearPocket"
          mkdir -p Assets.xcassets/AppIcon.appiconset

          cat > /tmp/clearpocket-icon.swift <<'SWIFT'
          import AppKit

          let bitmap = NSBitmapImageRep(
              bitmapDataPlanes: nil,
              pixelsWide: 1024,
              pixelsHigh: 1024,
              bitsPerSample: 8,
              samplesPerPixel: 3,
              hasAlpha: false,
              isPlanar: false,
              colorSpaceName: .deviceRGB,
              bytesPerRow: 0,
              bitsPerPixel: 0
          )!

          NSGraphicsContext.saveGraphicsState()
          NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: bitmap)

          NSColor(
              calibratedRed: 0.04,
              green: 0.55,
              blue: 0.53,
              alpha: 1
          ).setFill()
          NSBezierPath(rect: NSRect(
              x: 0, y: 0, width: 1024, height: 1024
          )).fill()

          NSColor.white.setStroke()
          let pocket = NSBezierPath(
              roundedRect: NSRect(
                  x: 240, y: 240, width: 544, height: 544
              ),
              xRadius: 110,
              yRadius: 110
          )
          pocket.lineWidth = 42
          pocket.stroke()

          let check = NSBezierPath()
          check.move(to: NSPoint(x: 350, y: 510))
          check.line(to: NSPoint(x: 465, y: 395))
          check.line(to: NSPoint(x: 690, y: 635))
          check.lineWidth = 54
          check.lineCapStyle = .round
          check.lineJoinStyle = .round
          check.stroke()

          NSGraphicsContext.restoreGraphicsState()
          let png = bitmap.representation(using: .png, properties: [:])!
          try png.write(to: URL(
              fileURLWithPath: "Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          ))
          SWIFT

          swift /tmp/clearpocket-icon.swift

          ruby <<'RUBY'
          require 'json'
          require 'yaml'

          catalog = 'Assets.xcassets'
          File.write("#{catalog}/Contents.json", JSON.generate({
            info: {author: 'xcode', version: 1}
          }))
          File.write("#{catalog}/AppIcon.appiconset/Contents.json",
            JSON.generate({
              images: [{
                filename: 'AppIcon.png',
                idiom: 'universal',
                platform: 'ios',
                size: '1024x1024'
              }],
              info: {author: 'xcode', version: 1}
            })
          )

          project = YAML.load_file('project.yml')
          target = project.fetch('targets').fetch('ClearPocket')
          target['sources'] << 'Assets.xcassets'
          target['settings'] ||= {}
          target['settings']['base'] ||= {}
          settings = target['settings']['base']
          settings['ASSETCATALOG_COMPILER_APPICON_NAME'] = 'AppIcon'
          settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.grost9999.clearpocket'
          settings['MARKETING_VERSION'] = '0.1.0'
          settings['CURRENT_PROJECT_VERSION'] =
            (ENV.fetch('BUILD_NUMBER', '1').to_i + 100).to_s
          File.write('project.yml', YAML.dump(project))
          RUBY

      - name: Generate Xcode project
        script: |
          set -e
          cd "$CM_BUILD_DIR/ClearPocket"
          xcodegen generate

      - name: Configure signing
        script: |
          set -e
          cd "$CM_BUILD_DIR/ClearPocket"
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          set -e
          cd "$CM_BUILD_DIR/ClearPocket"
          xcode-project build-ipa \
            --project ClearPocket.xcodeproj \
            --scheme ClearPocket

    artifacts:
      - ClearPocket/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
