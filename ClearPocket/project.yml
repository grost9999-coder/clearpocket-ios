name: ClearPocket
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.example.clearpocket
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ClearPocket:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 清爽口袋
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: 掃描完全重複的照片，並在你確認後刪除多餘副本。
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
