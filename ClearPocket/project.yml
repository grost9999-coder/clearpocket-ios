name: ClearPocket

options:
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.grost9999.clearpocket
    TARGETED_DEVICE_FAMILY: "1"

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 9.0.0

targets:
  ClearPocket:
    type: application
    platform: iOS

    sources:
      - Sources

    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift

    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 清爽口袋
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)

        UILaunchScreen: {}

        NSPhotoLibraryUsageDescription: 掃描完全重複的照片，並在你確認後刪除多餘副本。

        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

        GIDClientID: $(GOOGLE_CLIENT_ID)

        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)

    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.grost9999.clearpocket
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"

        GOOGLE_CLIENT_ID: 1096683541548-i3aevnhedftnla9h4bu052vclkbu7bfk.apps.googleusercontent.com

        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.1096683541548-i3aevnhedftnla9h4bu052vclkbu7bfk
